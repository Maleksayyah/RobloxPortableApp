<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Launcher</title>
    <style>
        :root {
            --primary: #00d2ff;
            --primary-gradient: linear-gradient(135deg, #00d2ff 0%, #0066ff 100%);
            --primary-glow: rgba(0, 210, 255, 0.35);
            --bg-dark: #0f111a;
            --bg-glass: rgba(22, 26, 42, 0.85);
            --border-glass: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #8e95ab;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            user-select: none;
        }

        body {
            background: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(0, 210, 255, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 80% 90%, rgba(0, 102, 255, 0.1) 0%, transparent 50%),
                linear-gradient(180deg, #0f111a 0%, #07080d 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 20px;
        }

        /* Container Card */
        .launcher-card {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 28px;
            padding: 36px 28px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .brand-icon-wrapper {
            width: 80px;
            height: 80px;
            background: rgba(0, 210, 255, 0.08);
            border: 1px solid rgba(0, 210, 255, 0.2);
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px var(--primary-glow);
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            fill: var(--primary);
        }

        .brand h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.04);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #00e676;
            box-shadow: 0 0 10px #00e676;
        }

        .status-dot.disabled {
            background-color: #ff5252;
            box-shadow: 0 0 10px #ff5252;
        }

        .actions {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 14px;
        }

        .btn {
            width: 100%;
            padding: 16px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 16px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .btn-primary {
            background: var(--primary-gradient);
            color: #ffffff;
            box-shadow: 0 8px 25px var(--primary-glow);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 210, 255, 0.5);
            filter: brightness(1.1);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--border-glass);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
        }

        .btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn:disabled {
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.25);
            border: 1px solid transparent;
            cursor: not-allowed;
            box-shadow: none;
        }

        .credits {
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .credits span {
            color: var(--text-main);
            font-weight: 600;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="launcher-card">
        <div class="brand">
            <div class="brand-icon-wrapper">
                <!-- Inline Gamepad SVG -->
                <svg class="brand-icon" viewBox="0 0 640 512">
                    <path d="M192 64C86 64 0 150 0 256s86 192 192 192c48.4 0 92.8-18 127-47.8 3.5 3 7.3 5.7 11.2 8.2l48 32c12.3 8.2 28.5 7.1 39.5-2.7s14.8-25.5 9.2-38.6L400.4 336c19.9-23.7 31.6-54.3 31.6-88 0-106-86-192-192-192zM112 232h32v-32c0-8.8 7.2-16 16-16s16 7.2 16 16v32h32c8.8 0 16 7.2 16 16s-7.2 16-16 16h-32v32c0 8.8-7.2 16-16 16s-16-7.2-16-16v-32h-32c-8.8 0-16-7.2-16-16s7.2-16 16-16zm128 40a24 24 0 1 1 0-48 24 24 0 1 1 0 48zm48-64a24 24 0 1 1 0-48 24 24 0 1 1 0 48z"/>
                </svg>
            </div>
            <h1>Roblox Launcher</h1>
            <div class="status-badge">
                <span id="statusDot" class="status-dot"></span>
                <span id="statusText">Ready to Launch</span>
            </div>
        </div>

        <div class="actions">
            <button id="startButton" class="btn btn-primary" onclick="launchGame()">
                <!-- Inline Play SVG -->
                <svg viewBox="0 0 384 512">
                    <path d="M73 39c-14.8-9.1-33.4-9.4-48.5-.9S0 62.6 0 80V432c0 17.4 9.4 33.4 24.5 41.9s33.7 8.2 48.5-.9L361 297c14.3-8.7 23-24.2 23-41s-8.7-32.3-23-41L73 39z"/>
                </svg>
                Launch Game
            </button>
            <button id="webButton" class="btn btn-secondary" onclick="openRobloxWebsite()">
                <!-- Inline Globe SVG -->
                <svg viewBox="0 0 512 512">
                    <path d="M512 256C512 397.4 397.4 512 256 512C114.6 512 0 397.4 0 256C0 114.6 114.6 0 256 0C397.4 0 512 114.6 512 256zM256 48c-29.1 0-66.7 34.6-83.3 96h166.6c-16.6-61.4-54.2-96-83.3-96zM128 176c-8.1 24.7-12.8 51.7-13.6 80h283.2c-.8-28.3-5.5-55.3-13.6-80H128zm-13.6 112c.8 28.3 5.5 55.3 13.6 80h256.8c8.1-24.7 12.8-51.7 13.6-80H114.4z"/>
                </svg>
                Open Roblox Site
            </button>
        </div>

        <div class="credits">
            Designed by <span>Malek Al Sayyah</span>
        </div>
    </div>

    <script>
        function launchGame() {
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage("launch_game");
            }
        }

        function openRobloxWebsite() {
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage("open_website");
            }
        }

        if (window.chrome && window.chrome.webview) {
            window.chrome.webview.addEventListener('message', event => {
                if (event.data === "disable_start") {
                    const btn = document.getElementById("startButton");
                    const dot = document.getElementById("statusDot");
                    const text = document.getElementById("statusText");

                    btn.disabled = true;
                    btn.innerHTML = `
                        <svg viewBox="0 0 512 512">
                            <path d="M256 32c14.2 0 27.3 7.5 34.5 19.8l216 368c7.3 12.4 7.3 27.7 .2 40.1S486.3 480 472 480H40c-14.3 0-27.6-7.7-34.7-20.1s-7-27.7 .3-40.1l216-368C228.7 39.5 241.8 32 256 32zm0 128c-13.3 0-24 10.7-24 24V296c0 13.3 10.7 24 24 24s24-10.7 24-24V184c0-13.3-10.7-24-24-24zm32 224a32 32 0 1 0 -64 0 32 32 0 1 0 64 0z"/>
                        </svg>
                        Not Found`;
                    
                    dot.classList.add("disabled");
                    text.innerText = "Executable Missing";
                }
            });
        }
    </script>
</body>
</html>
