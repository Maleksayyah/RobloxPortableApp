<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Launcher</title>
    <style>
        :root {
            --primary: #00d2ff;
            --primary-gradient: linear-gradient(135deg, #00d2ff 0%, #0066ff 100%);
            --primary-glow: rgba(0, 210, 255, 0.35);
            --bg-dark: #0f111a;
            --bg-glass: rgba(22, 26, 42, 0.85);
            --border-glass: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #8e95ab;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            user-select: none;
        }

        body {
            background: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(0, 210, 255, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 80% 90%, rgba(0, 102, 255, 0.1) 0%, transparent 50%),
                linear-gradient(180deg, #0f111a 0%, #07080d 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 20px;
        }

        /* Container Card */
        .launcher-card {
            position: relative;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 28px;
            padding: 36px 28px 48px 28px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .brand-icon-wrapper {
            width: 80px;
            height: 80px;
            background: rgba(0, 210, 255, 0.08);
            border: 1px solid rgba(0, 210, 255, 0.2);
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px var(--primary-glow);
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            fill: var(--primary);
        }

        .brand h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.04);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #00e676;
            box-shadow: 0 0 10px #00e676;
        }

        .status-dot.disabled {
            background-color: #ff5252;
            box-shadow: 0 0 10px #ff5252;
        }

        .actions {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 14px;
        }

        .btn {
            width: 100%;
            padding: 16px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 16px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .btn-primary {
            background: var(--primary-gradient);
            color: #ffffff;
            box-shadow: 0 8px 25px var(--primary-glow);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 210, 255, 0.5);
            filter: brightness(1.1);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--border-glass);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
        }

        .btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn:disabled {
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.25);
            border: 1px solid transparent;
            cursor: not-allowed;
            box-shadow: none;
        }

        .credits {
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .credits span {
            color: var(--text-main);
            font-weight: 600;
        }

        /* --- Settings Gear & Dropdown Styling --- */
        .settings-wrapper {
            position: absolute;
            bottom: 16px;
            right: 20px;
        }

        .settings-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .settings-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            transition: transform 0.4s ease;
        }

        .settings-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: var(--primary);
            border-color: rgba(0, 210, 255, 0.3);
        }

        .settings-btn:hover svg {
            transform: rotate(90deg);
        }

        .settings-menu {
            position: absolute;
            bottom: 48px;
            right: 0;
            background: rgba(18, 22, 36, 0.95);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border-glass);
            border-radius: 14px;
            padding: 6px;
            width: 170px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            display: none;
            flex-direction: column;
            gap: 4px;
            z-index: 100;
            animation: fadeIn 0.2s ease-out;
        }

        .settings-menu.show {
            display: flex;
        }

        .menu-item {
            background: transparent;
            border: none;
            color: var(--text-main);
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 0.82rem;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .menu-item svg {
            width: 15px;
            height: 15px;
            fill: var(--text-muted);
            transition: fill 0.2s ease;
        }

        .menu-item:hover {
            background: rgba(0, 210, 255, 0.12);
            color: var(--primary);
        }

        .menu-item:hover svg {
            fill: var(--primary);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="launcher-card">
        <div class="brand">
            <div class="brand-icon-wrapper">
                <svg class="brand-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512">
                    <path d="M73 39c-14.8-9.1-33.4-9.4-48.5-.9S0 62.6 0 80V432c0 17.4 9.4 33.4 24.5 41.9s33.7 8.2 48.5-.9L361 297c14.3-8.7 23-24.2 23-41s-8.7-32.3-23-41L73 39z"/>
                </svg>
            </div>
            <h1>Roblox Launcher</h1>
            <div class="status-badge">
                <span id="statusDot" class="status-dot"></span>
                <span id="statusText">Ready to Launch</span>
            </div>
        </div>

        <div class="actions">
            <button id="startButton" class="btn btn-primary" onclick="launchGame()">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                Launch Game
            </button>
            <button id="webButton" class="btn btn-secondary" onclick="openRobloxWebsite()">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                </svg>
                Open Roblox Site
            </button>
        </div>

        <div class="credits">
            Designed by <span>Malek Al Sayyah</span>
        </div>

        <!-- Settings Gear Component -->
        <div class="settings-wrapper">
            <button class="settings-btn" id="settingsBtn" title="Settings" onclick="toggleSettings(event)">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                </svg>
            </button>
            <div class="settings-menu" id="settingsMenu">
                <button class="menu-item" onclick="updateRoblox()">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
                    </svg>
                    Update Roblox
                </button>
                <button class="menu-item" onclick="checkForUpdate()">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>
                    </svg>
                    Check For Update
                </button>
            </div>
        </div>
    </div>

    <script>
        function launchGame() {
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage("launch_game");
            }
        }

        function openRobloxWebsite() {
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage("open_website");
            }
        }

        function toggleSettings(event) {
            event.stopPropagation();
            const menu = document.getElementById("settingsMenu");
            menu.classList.toggle("show");
        }

        function updateRoblox() {
            document.getElementById("settingsMenu").classList.remove("show");
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage("update_roblox");
            }
        }

        function checkForUpdate() {
            document.getElementById("settingsMenu").classList.remove("show");
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage("check_for_update");
            }
        }

        document.addEventListener("click", () => {
            const menu = document.getElementById("settingsMenu");
            if (menu) {
                menu.classList.remove("show");
            }
        });

        if (window.chrome && window.chrome.webview) {
            window.chrome.webview.addEventListener('message', event => {
                if (event.data === "disable_start") {
                    const btn = document.getElementById("startButton");
                    const dot = document.getElementById("statusDot");
                    const text = document.getElementById("statusText");

                    btn.disabled = true;
                    btn.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <path d="M12 2L1 21h22L12 2zm1 14h-2v-2h2v2zm0-4h-2V8h2v4z"/>
                        </svg>
                        Not Found`;
                    
                    dot.classList.add("disabled");
                    text.innerText = "Executable Missing";
                }
            });
        }
    </script>
</body>
</html>
